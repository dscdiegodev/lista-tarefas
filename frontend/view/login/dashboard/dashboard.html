<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Minhas Tarefas</title>
    <link rel="stylesheet" href="dashboard.css">
</head>

<body>

    <div class="container">
        <header>
            <h2>Minhas Tarefas</h2>
            <button id="btnLogout" class="btn-sair">Sair</button>
        </header>

        <div class="content">
            <div id="mensagem" class="mensagem"></div>

            <!-- Cards de Resumo -->
            <div class="resumo-container">
                <div class="total-tarefas">
                    <h4>Total de Tarefas</h4>
                    <p id="totalTarefas">0</p>
                </div>

                <div class="total-concluido">
                    <h4>Concluídas</h4>
                    <p id="totalConcluidas">0</p>
                </div>

                <div class="total-pendente">
                    <h4>Pendentes</h4>
                    <p id="totalPendentes">0</p>
                </div>
            </div>

            <!-- Formulário para Adicionar Tarefa -->
            <div class="form-container">
                <h3>Nova Tarefa</h3>
                <form id="formNovaTarefa">
                    <input type="text" id="tituloTarefa" placeholder="Título da tarefa" required>
                    <input type="text" id="descricaoTarefa" placeholder="Descrição da tarefa">
                    <input type="date" id="prazoTarefa" required>

                    <select id="categoriaTarefa">
                        <option value="">Selecione uma categoria (Opcional)</option>
                    </select>

                    <button type="submit" class="btn-adicionar">Adicionar Tarefa</button>
                </form>
            </div>

            <!-- Seção Principal: Filtros e Tabela de Tarefas (Em destaque no topo) -->
            <div style="margin-top: 30px; margin-bottom: 30px;">
                <h3 style="margin-bottom: 15px; color: #333;">Suas Tarefas</h3>

                <div class="filtros-container">
                    <div>
                        <label for="filtroStatus">Filtrar por Status:</label>
                        <select id="filtroStatus">
                            <option value="">Todos os Status</option>
                            <option value="Pendente">Pendente</option>
                            <option value="Concluída">Concluída</option>
                            <option value="Em Andamento">Em Andamento</option>
                            <option value="Atrasada">Atrasada</option>
                        </select>
                    </div>

                    <div>
                        <label for="filtroCategoria">Filtrar por Categoria:</label>
                        <select id="filtroCategoria">
                            <option value="">Todas as Categorias</option>
                            <!-- Preenchido via JS -->
                        </select>
                    </div>

                    <div>
                        <label for="ordenarPor">Ordenar por Prazo:</label>
                        <select id="ordenarPor">
                            <option value="">Padrão (Criação)</option>
                            <option value="asc">Mais Próximas (Crescente)</option>
                            <option value="desc">Mais Distantes (Decrescente)</option>
                        </select>
                    </div>
                </div>

                <table class="tabela-tarefas">
                    <thead>
                        <tr>
                            <th>Título</th>
                            <th>Descrição</th>
                            <th>Categoria</th>
                            <th>Status</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="listaTarefas">
                        <!-- Preenchido via JS -->
                    </tbody>
                </table>
            </div>

            <hr style="border: 0; border-top: 1px solid #eee; margin: 40px 0;">

            <!-- Seção Secundária: Gerenciar Categorias (Mais abaixo) -->
            <div class="categoria-section">
                <h3>Gerenciar Categorias</h3>
                <form id="formNovaCategoria">
                    <input type="text" id="nomeNovaCategoria" placeholder="Nome da nova categoria" required>
                    <input type="text" id="corNovaCategoria" placeholder="Cor da categoria" required>
                    <button class="btn-categoria" type="submit">Adicionar Categoria</button>
                </form>

                <table class="tabela-categoria">
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Cor</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="listaCategorias">
                        <!-- Preenchido via JS -->
                    </tbody>
                </table>
            </div>

        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="dashboard.js"></script>
</body>

</html>
