<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Minhas Tarefas</title>
    <link rel="stylesheet" href="dashboard.css">
</head>

<body>

    <div class="container">
        <header>
            <h2>Minhas Tarefas</h2>
            <div style="display: flex; gap: 10px; align-items: center;">
                <button onclick="window.location.href='categorias-tags.html'" class="btn-categoria"
                    style="background-color: #17a2b8; padding: 8px 12px; border: none; border-radius: 4px; color: white; cursor: pointer;">Gerenciar
                    Categorias/Tags</button>
                <button id="btnLogout" class="btn-sair">Sair</button>
            </div>
        </header>

        <div class="content">
            <div id="mensagem" class="mensagem"></div>

            <!-- Cards de Resumo -->
            <div class="resumo-container">
                <div class="total-tarefas">
                    <h4>Total de Tarefas</h4>
                    <p id="totalTarefas">0</p>
                </div>

                <div class="total-concluido">
                    <h4>Concluídas</h4>
                    <p id="totalConcluidas">0</p>
                </div>

                <div class="total-pendente">
                    <h4>Pendentes</h4>
                    <p id="totalPendentes">0</p>
                </div>
            </div>

            <!-- Formulário para Adicionar Tarefa -->
            <div class="form-container">
                <h3>Nova Tarefa</h3>
                <form id="formNovaTarefa">
                    <input type="text" id="tituloTarefa" placeholder="Título da tarefa" required>
                    <input type="text" id="descricaoTarefa" placeholder="Descrição da tarefa">
                    <input type="date" id="prazoTarefa" required>

                    <select id="prioridadeTarefa">
                        <option value="Baixa">Baixa</option>
                        <option value="Média" selected>Média</option>
                        <option value="Alta">Alta</option>
                        <option value="Urgente">Urgente</option>
                    </select>

                    <select id="categoriaTarefa">
                        <option value="">Selecione uma categoria (Opcional)</option>
                    </select>

                    <button type="submit" class="btn-adicionar">Adicionar Tarefa</button>
                </form>
            </div>

            <!-- Seção Principal: Filtros e Tabela de Tarefas -->
            <div style="margin-top: 30px; margin-bottom: 30px;">
                <h3 style="margin-bottom: 15px; color: #333;">Suas Tarefas</h3>

                <div class="filtros-container">
                    <div>
                        <label for="filtroStatus">Filtrar por Status:</label>
                        <select id="filtroStatus">
                            <option value="">Todos os Status</option>
                            <option value="Pendente">Pendente</option>
                            <option value="Concluída">Concluída</option>
                            <option value="Em Andamento">Em Andamento</option>
                            <option value="Atrasada">Atrasada</option>
                        </select>
                    </div>

                    <div>
                        <label for="filtroCategoria">Filtrar por Categoria:</label>
                        <select id="filtroCategoria">
                            <option value="">Todas as Categorias</option>
                            <!-- Preenchido via JS -->
                        </select>
                    </div>

                    <div>
                        <label for="ordenarPor">Ordenar por Prazo:</label>
                        <select id="ordenarPor">
                            <option value="">Padrão (Criação)</option>
                            <option value="asc">Mais Próximas (Crescente)</option>
                            <option value="desc">Mais Distantes (Decrescente)</option>
                        </select>
                    </div>
                </div>

                <table class="tabela-tarefas">
                    <thead>
                        <tr>
                            <th style="width: 15%;">Título</th>
                            <th style="width: 25%;">Descrição</th>
                            <th style="width: 15%;">Categoria</th>
                            <th style="width: 15%;">Prioridade / Status</th>
                            <th style="width: 15%;">Tags</th>
                            <th style="width: 15%;">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="listaTarefas">
                        <!-- Preenchido via JS -->
                    </tbody>
                </table>
            </div>

        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="dashboard.js"></script>
</body>

</html>
